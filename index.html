<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskboard</title>
    <script>
      // GitHub Pages SPA redirect: restore path from ?p= query param
      (function () {
        var p = window.location.search.slice(1).split('&').find(function(s){ return s.startsWith('p='); });
        if (p) {
          var path = decodeURIComponent(p.slice(2));
          window.history.replaceState(null, null, '/Taskboard/' + path);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
